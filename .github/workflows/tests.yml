name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Guile tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Guile and guile-json
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends guile-3.0 guile-json

      - name: Run tests
        run: make check GUILE="$(command -v guile || command -v guile-3.0)"

      - name: Compile modules
        env:
          GUILE_AUTO_COMPILE: "0"
        run: |
          guild="$(command -v guild || command -v guild-3.0)"
          for file in modules/tofuix/*.scm modules/tofuix.scm examples/*.scm; do
            echo "compiling $file"
            "$guild" compile -L modules -L . "$file"
          done
